[project]
name = "long-horizon-agent"
version = "0.1.0"
description = "Long-Horizon DeepSearch Agent Harness — FastAPI + LangGraph + Middleware + MySQL + Redis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    # Agent Runtime
    "langgraph>=0.2.0",
    "langgraph-checkpoint-mysql>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    # Redis
    "redis>=5.2.0",
    # HTTP / Parsing
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "beautifulsoup4>=4.12.0",
    # Schema
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Observability
    "opentelemetry-api>=1.28.0",
    # Utils
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
