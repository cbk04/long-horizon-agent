[project]
name = "long-horizon-agent"
version = "0.1.0"
description = "Long-Horizon DeepSearch Agent Harness — FastAPI + LangGraph + Middleware + MySQL + Redis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sse-starlette>=3.4.8",
    # Agent Runtime
    "langgraph>=1.2.11",
    "langgraph-checkpoint-mysql>=3.0.0",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    # Database
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "pymysql>=1.2.0",
    "cryptography>=50.0.1",
    # Redis
    "redis>=8.1.0",
    # HTTP / Parsing
    "httpx>=0.28.1",
    "trafilatura>=2.2.0",
    "beautifulsoup4>=4.15.0",
    # Schema
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # Observability
    "opentelemetry-api>=1.44.0",
    # Utils
    "python-dotenv>=1.2.3",
    "structlog>=26.1.0",
    "langchain>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.5",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
# pydantic 插件让 mypy 正确理解 pydantic 模型,能捕获 `settings.缺失字段`
# 这类运行时才会爆的 AttributeError(见 app/agent/tools/search.py)。
plugins = ["pydantic.mypy"]
python_version = "3.11"
# langgraph / langchain 等未提供完整类型存根,忽略第三方导入的报错。
ignore_missing_imports = true
# 即便函数无完整注解,也检查其内部对已注解对象的访问(捕获 settings.xxx 的关键)。
check_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "mypy>=1.13.0",
]
